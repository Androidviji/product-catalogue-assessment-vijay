# Local infrastructure. Free, no accounts needed.
#
# Mailpit is a local "fake inbox": it accepts email over SMTP and shows it in a web page.
# The backend sends enquiry emails here. Mailpit never delivers them to a real mailbox.
#   SMTP:   localhost:1025
#   Web UI: http://localhost:8025
#
# Ports are bound to 127.0.0.1 so they are not exposed to your local network.

services:
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
